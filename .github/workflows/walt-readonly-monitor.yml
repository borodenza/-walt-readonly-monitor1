name: Walt Mira SHORT - Rules Audit Only

# This workflow NEVER scans external markets or Walt accounts.
# Actual read-only market checks are scheduled in the ChatGPT automation,
# every 4 hours. The old Hyperliquid LONG scanner is retired.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PROMPT.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'SYSTEM.md'
      - 'rules/**'
      - 'scripts/**'
      - '.github/workflows/walt-readonly-monitor.yml'

permissions:
  contents: read

jobs:
  rules_audit:
    name: Check SHORT rule files - no market data, no orders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without stored auth
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify SHORT strategy configuration exists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          strategy = Path('rules/strategy.md')
          prompt = Path('PROMPT.md')
          if not strategy.exists() or not prompt.exists():
              print('SHORT strategy files missing; no market research performed.')
              raise SystemExit(1)
          content = strategy.read_text(encoding='utf-8').lower()
          required = ('short', '10%', '5x', '2–2,5%', 'подтвержден')
          if any(s not in content for s in required):
              print('Strategy documentation incomplete; fail closed.')
              raise SystemExit(1)
          print('Mira SHORT rules validated. Trading disabled. No quotes or signals generated.')
          PY
